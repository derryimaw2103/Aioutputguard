name: Security

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  schedule:
    - cron: "20 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect JavaScript or TypeScript source
        id: source
        shell: bash
        run: |
          if find . -path './node_modules' -prune -o \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' -o -name '*.ts' -o -name '*.tsx' \) -print -quit | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No source yet
        if: steps.source.outputs.exists == 'false'
        run: echo "No JavaScript or TypeScript source yet. CodeQL will run after source files are added."

      - name: Initialize CodeQL
        if: steps.source.outputs.exists == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Analyze
        if: steps.source.outputs.exists == 'true'
        uses: github/codeql-action/analyze@v3
