source:
  - changed-files:
      - any-glob-to-any-file:
          - "src/**/*"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**/*"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"

workflows:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**/*"

configuration:
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "package-lock.json"
          - "tsconfig.json"
          - "eslint.config.js"
          - "vitest.config.ts"
          - "governance.yaml"
